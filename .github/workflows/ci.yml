name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Type check
        run: pnpm check
      - name: Lint application and tests
        run: pnpm exec eslint src tests vite.config.ts eslint.config.js
      - name: Unit and component tests
        run: node scripts/with-test-env.mjs pnpm exec vitest run --project unit --project client --maxWorkers=2
      - name: Production build
        run: node scripts/with-test-env.mjs pnpm build
      - name: Production browser regression tests
        run: pnpm test:browser
        env:
          TEST_SERVER_MODE: preview
